<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Slider Studio Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--bg:#0f172a;
--card:rgba(255,255,255,.08);
--text:#ffffff;
--accent:#00e5ff;
--blur:20px;
}

body{
background:var(--bg);
color:var(--text);
overflow-x:hidden;
min-height:100vh;
}

/* ==========================
   Animated Background
========================== */

.bg-animation{
position:fixed;
inset:0;
overflow:hidden;
z-index:-2;
}

.circle{
position:absolute;
border-radius:50%;
filter:blur(80px);
opacity:.35;
animation:float 18s infinite linear;
}

.c1{
width:300px;
height:300px;
background:#00f5ff;
top:5%;
left:5%;
}

.c2{
width:400px;
height:400px;
background:#ff00ff;
right:5%;
top:20%;
}

.c3{
width:350px;
height:350px;
background:#ff8800;
left:30%;
bottom:0;
}

@keyframes float{
0%{transform:translateY(0) rotate(0deg);}
50%{transform:translateY(-80px) rotate(180deg);}
100%{transform:translateY(0) rotate(360deg);}
}

/* ==========================
   Dashboard Layout
========================== */

.dashboard{
display:grid;
grid-template-columns:280px 1fr;
min-height:100vh;
}

.sidebar{
background:rgba(255,255,255,.05);
backdrop-filter:blur(var(--blur));
border-right:1px solid rgba(255,255,255,.1);
padding:25px;
}

.logo{
font-size:24px;
font-weight:700;
margin-bottom:40px;
text-align:center;
color:var(--accent);
}

.menu{
display:flex;
flex-direction:column;
gap:15px;
}

.menu button{
padding:15px;
border:none;
border-radius:15px;
background:rgba(255,255,255,.08);
color:white;
cursor:pointer;
transition:.3s;
}

.menu button:hover{
background:var(--accent);
color:black;
transform:translateX(5px);
}

.main{
padding:25px;
}

/* ==========================
   Glass Cards
========================== */

.glass{
background:var(--card);
backdrop-filter:blur(var(--blur));
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:20px;
box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-bottom:25px;
}

.search-box{
flex:1;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:rgba(255,255,255,.08);
color:white;
outline:none;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.stat-card h3{
font-size:15px;
opacity:.8;
margin-bottom:10px;
}

.stat-card h1{
font-size:32px;
color:var(--accent);
}

/* ==========================
   Upload Section
========================== */

.upload-area{
margin-bottom:25px;
padding:40px;
text-align:center;
border:2px dashed rgba(255,255,255,.25);
border-radius:20px;
cursor:pointer;
transition:.3s;
}

.upload-area:hover{
border-color:var(--accent);
background:rgba(255,255,255,.04);
}

.upload-area h2{
margin-bottom:10px;
}

.upload-area p{
opacity:.7;
}

/* ==========================
   Slider Container
========================== */

.slider-card{
padding:20px;
}

.slider{
position:relative;
height:520px;
overflow:hidden;
border-radius:20px;
}

.slide{
position:absolute;
width:100%;
height:100%;
opacity:0;
transform:scale(1.05);
transition:all .8s ease;
}

.slide.active{
opacity:1;
transform:scale(1);
}

.slide img{
width:100%;
height:100%;
object-fit:cover;
}

/* ==========================
   Navigation Buttons
========================== */

.nav-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
width:55px;
height:55px;
border:none;
border-radius:50%;
cursor:pointer;
font-size:22px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
color:white;
z-index:10;
}

.prev{
left:20px;
}

.next{
right:20px;
}

/* ==========================
   Progress Bar
========================== */

.progress{
height:6px;
background:rgba(255,255,255,.1);
margin-top:20px;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00f5ff,#ff00ff);
}

/* ==========================
   Thumbnails
========================== */

.thumbnails{
display:flex;
gap:10px;
overflow:auto;
margin-top:20px;
padding-bottom:10px;
}

.thumb{
width:120px;
height:80px;
border-radius:10px;
overflow:hidden;
cursor:pointer;
opacity:.6;
transition:.3s;
}

.thumb.active{
opacity:1;
outline:3px solid var(--accent);
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
}

/* ==========================
   Responsive
========================== */

@media(max-width:900px){

.dashboard{
grid-template-columns:1fr;
}

.sidebar{
display:none;
}

.slider{
height:350px;
}

}

</style>
</head>

<body>

<div class="bg-animation">
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
</div>

<div class="dashboard">

<div class="sidebar">

<div class="logo">
Studio Pro
</div>

<div class="menu">
<button>Dashboard</button>
<button>Gallery</button>
<button>Themes</button>
<button>Import</button>
<button>Export</button>
<button>Settings</button>
</div>

</div>

<div class="main">

<div class="topbar">

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search images...">
</div>

<button id="themeBtn">Switch Theme</button>

</div>

<div class="stats">

<div class="glass stat-card">
<h3>Total Images</h3>
<h1 id="totalImages">0</h1>
</div>

<div class="glass stat-card">
<h3>Favorites</h3>
<h1>0</h1>
</div>

<div class="glass stat-card">
<h3>Storage</h3>
<h1>0 MB</h1>
</div>

</div>

<div class="glass upload-area" id="dropArea">

<h2>Drag & Drop Images</h2>
<p>or click to upload</p>

<input
type="file"
id="imageInput"
multiple
accept="image/*"
hidden>

</div>

<div class="glass slider-card">

<div class="slider" id="slider"></div>

<button class="nav-btn prev" id="prevBtn">❮</button>
<button class="nav-btn next" id="nextBtn">❯</button>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="thumbnails" id="thumbnails"></div>

</div>

</div>

</div>
<script>


/* ====================================
   IMAGE DATA
==================================== */

let images = [
{
name:"Mountain",
url:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600"
},
{
name:"Beach",
url:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600"
},
{
name:"Forest",
url:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600"
},
{
name:"City",
url:"https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1600"
},
{
name:"Mountain",
url:"https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600"
},
{
name:"Beach",
url:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1600"
},
{
name:"Forest",
url:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600"
},
{
name:"City",
url:"https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=1600"
},
{
name:"Desert",
url:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1600"
},
{
name:"Waterfall",
url:"https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1600"
},
{
name:"Snow Mountains",
url:"https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1600"
},
{
name:"Lake",
url:"https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1600"
},
{
name:"Road Trip",
url:"https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1600"
},
{
name:"Night Sky",
url:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1600"
},
];

let filteredImages = [...images];

let currentIndex = 0;
let autoplay = true;
let autoplayDelay = 4000;
let interval;

/* ====================================
   DOM ELEMENTS
==================================== */

const slider = document.getElementById("slider");
const thumbnails = document.getElementById("thumbnails");
const progressBar = document.getElementById("progressBar");
const totalImages = document.getElementById("totalImages");
const imageInput = document.getElementById("imageInput");
const dropArea = document.getElementById("dropArea");
const searchInput = document.getElementById("searchInput");

/* ====================================
   UPDATE STATS
==================================== */

function updateStats(){

totalImages.textContent = filteredImages.length;

}

/* ====================================
   RENDER SLIDES
==================================== */

function renderSlides(){

slider.innerHTML = "";

filteredImages.forEach((item,index)=>{

const slide = document.createElement("div");
slide.className = "slide";

if(index===currentIndex){
slide.classList.add("active");
}

slide.innerHTML = `
<img src="${item.url}" alt="${item.name}">
`;

slider.appendChild(slide);

});

renderThumbs();
updateStats();

}

/* ====================================
   RENDER THUMBNAILS
==================================== */

function renderThumbs(){

thumbnails.innerHTML="";

filteredImages.forEach((item,index)=>{

const thumb = document.createElement("div");

thumb.className =
index===currentIndex
? "thumb active"
: "thumb";

thumb.innerHTML =
`<img src="${item.url}">`;

thumb.onclick = ()=>{

currentIndex=index;
renderSlides();

};

thumbnails.appendChild(thumb);

});

}

/* ====================================
   NEXT SLIDE
==================================== */

function nextSlide(){

if(filteredImages.length===0)return;

currentIndex++;

if(currentIndex>=filteredImages.length){
currentIndex=0;
}

renderSlides();
resetProgress();

}

/* ====================================
   PREVIOUS SLIDE
==================================== */

function prevSlide(){

if(filteredImages.length===0)return;

currentIndex--;

if(currentIndex<0){
currentIndex=filteredImages.length-1;
}

renderSlides();
resetProgress();

}

/* ====================================
   BUTTON EVENTS
==================================== */

document
.getElementById("nextBtn")
.addEventListener("click",nextSlide);

document
.getElementById("prevBtn")
.addEventListener("click",prevSlide);

/* ====================================
   AUTOPLAY
==================================== */

function startAutoplay(){

clearInterval(interval);

interval = setInterval(()=>{

if(autoplay){

nextSlide();

}

},autoplayDelay);

}

startAutoplay();

/* ====================================
   PROGRESS BAR
==================================== */

function resetProgress(){

progressBar.style.transition="none";
progressBar.style.width="0%";

setTimeout(()=>{

progressBar.style.transition=
`${autoplayDelay}ms linear`;

progressBar.style.width="100%";

},50);

}

resetProgress();

/* ====================================
   SEARCH
==================================== */

searchInput.addEventListener("input",()=>{

const value =
searchInput.value.toLowerCase();

filteredImages = images.filter(item=>{

return item.name
.toLowerCase()
.includes(value);

});

currentIndex = 0;

renderSlides();

});

/* ====================================
   DRAG & DROP
==================================== */

dropArea.addEventListener("click",()=>{

imageInput.click();

});

dropArea.addEventListener("dragover",(e)=>{

e.preventDefault();

dropArea.style.borderColor="#00e5ff";

});

dropArea.addEventListener("dragleave",()=>{

dropArea.style.borderColor=
"rgba(255,255,255,.25)";

});

dropArea.addEventListener("drop",(e)=>{

e.preventDefault();

dropArea.style.borderColor=
"rgba(255,255,255,.25)";

handleFiles(e.dataTransfer.files);

});

/* ====================================
   FILE INPUT
==================================== */

imageInput.addEventListener("change",(e)=>{

handleFiles(e.target.files);

});

/* ====================================
   HANDLE FILES
==================================== */

function handleFiles(files){

Array.from(files).forEach(file=>{

if(!file.type.startsWith("image/"))
return;

const reader = new FileReader();

reader.onload = function(event){

const obj = {

name:file.name,
url:event.target.result

};

images.push(obj);

saveData();

filteredImages=[...images];

renderSlides();

};

reader.readAsDataURL(file);

});

}

/* ====================================
   LOCAL STORAGE SAVE
==================================== */

function saveData(){

localStorage.setItem(
"studioProImages",
JSON.stringify(images)
);

}

/* ====================================
   LOAD DATA
==================================== */

function loadData(){

const data =
localStorage.getItem(
"studioProImages"
);

if(data){

images = JSON.parse(data);

filteredImages=[...images];

}

}

loadData();

/* ====================================
   KEYBOARD NAVIGATION
==================================== */

document.addEventListener(
"keydown",
(e)=>{

if(e.key==="ArrowRight"){

nextSlide();

}

if(e.key==="ArrowLeft"){

prevSlide();

}

}
);

/* ====================================
   TOUCH SWIPE
==================================== */

let startX = 0;

slider.addEventListener(
"touchstart",
e=>{

startX =
e.touches[0].clientX;

}
);

slider.addEventListener(
"touchend",
e=>{

let endX =
e.changedTouches[0].clientX;

if(startX-endX>50){

nextSlide();

}

if(endX-startX>50){

prevSlide();

}

}
);

/* ====================================
   DOWNLOAD IMAGE
==================================== */

function downloadCurrentImage(){

if(filteredImages.length===0)return;

const a =
document.createElement("a");

a.href =
filteredImages[currentIndex].url;

a.download =
filteredImages[currentIndex].name;

a.click();

}

/* ====================================
   CREATE DOWNLOAD BUTTON
==================================== */

const dlBtn =
document.createElement("button");

dlBtn.innerText =
"Download Image";

dlBtn.style.marginTop="20px";

dlBtn.onclick=
downloadCurrentImage;

document
.querySelector(".slider-card")
.appendChild(dlBtn);

/* ====================================
   EXPORT JSON
==================================== */

function exportImages(){

const data =
JSON.stringify(images);

const blob =
new Blob([data],{
type:"application/json"
});

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"slider-data.json";

a.click();

}

/* ====================================
   IMPORT JSON
==================================== */

function importImages(file){

const reader =
new FileReader();

reader.onload=(e)=>{

images =
JSON.parse(e.target.result);

filteredImages =
[...images];

saveData();

renderSlides();

};

reader.readAsText(file);

}

/* ====================================
   RENDER INITIAL
==================================== */

renderSlides();

</script>
<script>

/* ==========================================
   THEME SYSTEM
========================================== */

const themes = {

neon:{
bg:"#0f172a",
accent:"#00e5ff",
card:"rgba(255,255,255,.08)"
},

purple:{
bg:"#1e1b4b",
accent:"#c084fc",
card:"rgba(255,255,255,.08)"
},

sunset:{
bg:"#431407",
accent:"#fb923c",
card:"rgba(255,255,255,.08)"
}

};

let currentTheme = "neon";

/* ==========================================
   APPLY THEME
========================================== */

function applyTheme(theme){

document.documentElement.style
.setProperty("--bg", themes[theme].bg);

document.documentElement.style
.setProperty("--accent", themes[theme].accent);

document.documentElement.style
.setProperty("--card", themes[theme].card);

currentTheme = theme;

localStorage.setItem(
"studioTheme",
theme
);

}

/* ==========================================
   LOAD THEME
========================================== */

const savedTheme =
localStorage.getItem("studioTheme");

if(savedTheme){

applyTheme(savedTheme);

}

/* ==========================================
   THEME BUTTON
========================================== */

const themeButton =
document.getElementById("themeBtn");

themeButton.addEventListener(
"click",
()=>{

if(currentTheme==="neon"){

applyTheme("purple");

}
else if(currentTheme==="purple"){

applyTheme("sunset");

}
else{

applyTheme("neon");

}

}
);

/* ==========================================
   LIGHT / DARK MODE
========================================== */

let darkMode = true;

const modeBtn =
document.createElement("button");

modeBtn.innerText =
"🌙 Light/Dark";

modeBtn.style.marginLeft="10px";

document
.querySelector(".topbar")
.appendChild(modeBtn);

modeBtn.onclick = ()=>{

darkMode = !darkMode;

if(darkMode){

document.body.style.background =
"var(--bg)";

document.body.style.color =
"#ffffff";

}
else{

document.body.style.background =
"#f4f4f4";

document.body.style.color =
"#111111";

}

};

/* ==========================================
   PARTICLES BACKGROUND
========================================== */

const canvas =
document.createElement("canvas");

canvas.style.position="fixed";
canvas.style.inset="0";
canvas.style.zIndex="-3";

document.body.appendChild(canvas);

const ctx =
canvas.getContext("2d");

function resizeCanvas(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);

const particles = [];

for(let i=0;i<120;i++){

particles.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,

r:Math.random()*3+1,

vx:(Math.random()-.5)*1,
vy:(Math.random()-.5)*1

});

}

function drawParticles(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

particles.forEach(p=>{

ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.r,
0,
Math.PI*2
);

ctx.fillStyle =
"rgba(255,255,255,.5)";

ctx.fill();

p.x += p.vx;
p.y += p.vy;

if(p.x<0)p.x=canvas.width;
if(p.x>canvas.width)p.x=0;

if(p.y<0)p.y=canvas.height;
if(p.y>canvas.height)p.y=0;

});

requestAnimationFrame(
drawParticles
);

}

drawParticles();

/* ==========================================
   AI CAPTION GENERATOR
========================================== */

const captions = [

"Beautiful landscape captured perfectly.",
"Nature at its finest.",
"Memories frozen in time.",
"Creative visual storytelling.",
"Adventure begins here.",
"Dream destination vibes.",
"Elegant photography masterpiece.",
"Colorful moments worth sharing."

];

function generateCaption(){

return captions[
Math.floor(
Math.random() *
captions.length
)
];

}

const captionBox =
document.createElement("div");

captionBox.className =
"glass";

captionBox.style.marginTop =
"20px";

captionBox.innerHTML =

`
<h3>🤖 AI Caption Generator</h3>
<p id="captionText">
Click generate to create caption
</p>
<button id="captionBtn">
Generate Caption
</button>
`;

document
.querySelector(".main")
.appendChild(captionBox);

document
.getElementById("captionBtn")
.addEventListener(
"click",
()=>{

document
.getElementById("captionText")
.innerText =
generateCaption();

}
);

/* ==========================================
   FAVORITES SYSTEM
========================================== */

let favorites = [];

function toggleFavorite(){

if(filteredImages.length===0)
return;

const img =
filteredImages[currentIndex].url;

if(favorites.includes(img)){

favorites =
favorites.filter(
x=>x!==img
);

}
else{

favorites.push(img);

}

document
.querySelectorAll(".stat-card h1")[1]
.innerText =
favorites.length;

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

}

const favBtn =
document.createElement("button");

favBtn.innerText =
"❤️ Favorite";

favBtn.style.marginLeft =
"10px";

favBtn.onclick =
toggleFavorite;

document
.querySelector(".slider-card")
.appendChild(favBtn);

/* ==========================================
   STORAGE METER
========================================== */

function updateStorage(){

let size =
JSON.stringify(images).length;

let mb =
(size/1024/1024).toFixed(2);

document
.querySelectorAll(".stat-card h1")[2]
.innerText =
mb + " MB";

}

updateStorage();

setInterval(
updateStorage,
2000
);

/* ==========================================
   ADVANCED TRANSITIONS
========================================== */

function transitionSlides(){

const slides =
document.querySelectorAll(".slide");

slides.forEach((slide,index)=>{

if(index===currentIndex){

slide.style.opacity="1";
slide.style.transform=
"scale(1)";

}
else{

slide.style.opacity="0";
slide.style.transform=
"scale(1.08)";

}

});

}

setInterval(
transitionSlides,
500
);

/* ==========================================
   CUSTOM THEME CREATOR
========================================== */

const creator =
document.createElement("div");

creator.className="glass";

creator.style.marginTop="20px";

creator.innerHTML =

`
<h3>🎨 Custom Theme Creator</h3>

<input
type="color"
id="customAccent">

<button id="applyCustom">
Apply Theme
</button>
`;

document
.querySelector(".main")
.appendChild(creator);

document
.getElementById("applyCustom")
.addEventListener(
"click",
()=>{

const color =
document
.getElementById(
"customAccent"
)
.value;

document.documentElement
.style.setProperty(
"--accent",
color
);

}
);

/* ==========================================
   IMPORT BUTTON UI
========================================== */

const importInput =
document.createElement("input");

importInput.type="file";

importInput.accept=
"application/json";

importInput.style.marginTop=
"15px";

importInput.addEventListener(
"change",
e=>{

if(e.target.files[0]){

importImages(
e.target.files[0]
);

}

}
);

document
.querySelector(".main")
.appendChild(importInput);

/* ==========================================
   EXPORT BUTTON UI
========================================== */

const exportBtn =
document.createElement("button");

exportBtn.innerText =
"📤 Export Slider Data";

exportBtn.style.marginTop =
"15px";

exportBtn.onclick =
exportImages;

document
.querySelector(".main")
.appendChild(exportBtn);

</script>

</body>
</html>
<script>

/* ==================================
   FULLSCREEN MODE
================================== */

function toggleFullscreen(){

const sliderContainer =
document.querySelector(".slider-card");

if(!document.fullscreenElement){

sliderContainer.requestFullscreen();

}else{

document.exitFullscreen();

}

}

const fullscreenBtn =
document.createElement("button");

fullscreenBtn.innerHTML =
"🖥 Fullscreen";

fullscreenBtn.onclick =

/* ==================================
   IMAGE COMPRESSION
================================== */

function compressImage(
base64,
quality=0.7
){

return new Promise(resolve=>{

const img =
new Image();

img.onload = ()=>{

const canvas =
document.createElement(
"canvas"
);

canvas.width =
img.width;

canvas.height =
img.height;

const ctx =
canvas.getContext("2d");

ctx.drawImage(
img,
0,
0
);

resolve(
canvas.toDataURL(
"image/jpeg",
quality
)
);

};

img.src = base64;

});

}

showNotification(
"Compression Module Ready"
);
